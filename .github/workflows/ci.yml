name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      update_goldens:
        description: 'Regenerar la baseline de goldens en Linux (mismo entorno que CI)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Fijado: stable 3.50.0 rompe 22 tests (callbacks de fuente pendientes).
          # Ultima version con el pipeline en verde: 3.47.9 (run del 31-oct).
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # W0-4 (#277): ninguna clave del template puede quedarse sin traducir en
      # es/pt. `l10n.yaml` vuelca las pendientes a build/l10n/untranslated.json.
      - name: i18n gate (sin claves pendientes)
        run: |
          python3 - <<'PY'
          import json, sys
          pending = {k: v for k, v in json.load(open('build/l10n/untranslated.json')).items() if v}
          if pending:
              print('Claves sin traducir:', pending)
              sys.exit(1)
          print('i18n OK: todas las claves traducidas')
          PY

      # 0 errores y 0 warnings (P-17). Los infos no bloquean.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --coverage

      # P-18 (#103): cobertura medida y publicada en el resumen del run.
      - name: Coverage summary
        run: |
          awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END {printf "Cobertura de líneas: **%.1f%%** (%d/%d)\n", (lf?lh*100/lf:0), lh, lf}' coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

      # Si un pixel-golden falla, `flutter_test` deja los diffs al lado del PNG.
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/golden/failures/
          if-no-files-found: ignore

  goldens-baseline:
    name: Goldens baseline (Linux, manual)
    # Solo se ejecuta a mano: Actions → CI → Run workflow → update_goldens = true.
    # Regenera los PNG en el mismo runner/SDK que valida el CI y los deja como
    # artefacto para descargarlos y commitearlos (docs/runbooks/QUALITY_TESTS.md).
    if: github.event_name == 'workflow_dispatch' && inputs.update_goldens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Fijado: stable 3.50.0 rompe 22 tests (callbacks de fuente pendientes).
          # Ultima version con el pipeline en verde: 3.47.9 (run del 31-oct).
          flutter-version: '3.47.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Regenerate goldens
        run: flutter test test/golden --update-goldens

      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: goldens-baseline
          path: test/golden/goldens/
          if-no-files-found: error

  edge-functions:
    name: Edge Functions (deno check + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # P-18 (#103): valida tipos de las funciones (antes `deno check` fallaba)
      # y corre las pruebas puras (validación de entrada y de maná).
      - name: Type check
        run: |
          deno check supabase/functions/llm-proxy/index.ts
          deno check supabase/functions/lesson-generator/index.ts

      - name: Test
        run: deno test supabase/functions

  web-admin:
    name: Web admin (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web_admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  android-build:
    name: Android (AAB debug)
    # W0-4 (#277): un release puede romperse con el CI en verde. Este job compila
    # el bundle en cada PR para que Gradle/Manifest/iconos fallen aquí, no al
    # publicar. Va en debug para no depender de los secretos del keystore.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build AAB
        run: flutter build appbundle --debug

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: build/app/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error

  summary:
    name: Pipeline summary
    needs: [flutter, android-build, edge-functions, web-admin]
    runs-on: ubuntu-latest
    steps:
      - name: Echo status
        run: echo "Flutter (0 warnings), AAB debug, Edge Functions y web_admin en verde."
