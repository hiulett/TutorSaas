name: tutorsaas
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.21+22

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

  # State Management & Hooks
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.2
  go_router: ^14.0.0
  
  # Networking
  dio: ^5.4.0
  web_socket_channel: ^3.0.3
  supabase_flutter: ^2.6.0
  google_sign_in: ^6.2.1
  
  # Audio / Speech
  speech_to_text: ^7.3.0
  flutter_tts: ^4.0.0
  record: ^4.4.4
  video_player: ^2.9.3
  path_provider: ^2.1.2
  just_audio: ^0.9.44
  livekit_client: ^2.9.0

  # UI/UX & Utilities
  fl_chart: ^0.68.0
  google_fonts: ^6.1.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  logger: ^2.0.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  purchases_flutter: ^10.9.0
  purchases_ui_flutter: ^10.9.0
  sentry_flutter: 9.30.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Codegen
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.5.2

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/google_fonts/
    - assets/images/
    - assets/images/avatars/
    # Issue #52: `assets/videos/` y `assets/images/shop/` no se usan en la app
    # (0 referencias en lib/). Se dejan en el repo para el futuro pero fuera del
    # bundle: -8,6 MB.
    - assets/music/
