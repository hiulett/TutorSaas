name: tutorsaas
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.21+22

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

  # State Management & Hooks
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  
  # Networking
  dio: ^5.4.0
  supabase_flutter: ^2.6.0
  google_sign_in: ^6.2.1
  
  # Audio / Speech
  flutter_tts: ^4.0.0
  record: ^4.4.4
  path_provider: ^2.1.2
  just_audio: ^0.9.44
  livekit_client: ^2.9.0

  # UI/UX & Utilities
  fl_chart: ^0.68.0
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  freezed_annotation: ^2.4.1
  image_picker: ^1.1.2
  purchases_flutter: ^10.9.0
  purchases_ui_flutter: ^10.9.0
  sentry_flutter: 9.30.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Codegen
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.5.2

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/google_fonts/
    - assets/images/
    - assets/images/avatars/
    # Issue #52: `assets/videos/` y `assets/images/shop/` no se usan en la app
    # (0 referencias en lib/). Se dejan en el repo para el futuro pero fuera del
    # bundle: -8,6 MB.
    - assets/music/
