<style>
        body {
            background-color: #05070E;
            color: #e1e2ed;
        }
        
        .system-window-error {
            background-color: rgba(29, 31, 39, 0.94);
            border: 1px solid #FF1744;
            box-shadow: 0 0 15px rgba(255, 23, 68, 0.4), inset 0 0 20px rgba(255, 23, 68, 0.1);
            position: relative;
        }

        .system-window-error::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(45deg, transparent 40%, rgba(255, 23, 68, 0.05) 45%, rgba(255, 23, 68, 0.1) 50%, rgba(255, 23, 68, 0.05) 55%, transparent 60%);
            background-size: 200% 200%;
            animation: glitch-scan 4s infinite linear;
            pointer-events: none;
        }
        
        @keyframes glitch-scan {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .rune-pulse {
            animation: pulse-glow 2s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.3; filter: drop-shadow(0 0 2px #FF1744); }
            100% { opacity: 0.8; filter: drop-shadow(0 0 8px #FF1744); }
        }

        .glitch-text {
            position: relative;
            display: inline-block;
        }
        
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }
        
        .glitch-text::before {
            left: 2px;
            text-shadow: -1px 0 red;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }
        
        .glitch-text::after {
            left: -2px;
            text-shadow: -1px 0 blue;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }
        
        @keyframes glitch-anim {
            0% { clip: rect(12px, 9999px, 88px, 0); }
            10% { clip: rect(69px, 9999px, 7px, 0); }
            20% { clip: rect(32px, 9999px, 94px, 0); }
            30% { clip: rect(2px, 9999px, 48px, 0); }
            40% { clip: rect(74px, 9999px, 20px, 0); }
            50% { clip: rect(41px, 9999px, 19px, 0); }
            60% { clip: rect(98px, 9999px, 66px, 0); }
            70% { clip: rect(10px, 9999px, 83px, 0); }
            80% { clip: rect(57px, 9999px, 35px, 0); }
            90% { clip: rect(81px, 9999px, 55px, 0); }
            100% { clip: rect(14px, 9999px, 12px, 0); }
        }

        .btn-system {
            border: 1px solid #00E5FF;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        .btn-system:hover {
            background-color: #00E5FF;
            color: #05070E;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
        }

        .corner-accent {
            position: absolute;
            width: 10px;
            height: 10px;
            border: 2px solid #FF1744;
        }
        .tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        .br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop overflow-hidden">

</div>

<div class="absolute inset-0 bg-primary/20 -translate-x-full group-hover:translate-x-full transition-transform duration-700 ease-in-out"></div>
</button>
