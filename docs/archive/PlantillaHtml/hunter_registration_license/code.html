<style>
        body {

        .system-window {
            background-color: rgba(17, 19, 27, 0.94);

            color: #05070E;

        }
        
        .stat-bar-container {

        .stat-bar-segment.filled-cyan {

        .stat-bar-segment.filled-crimson {

        .stat-bar-segment.filled-gold {
            background-color: #ffc703;

        }
        
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(0, 229, 255, 0.5);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
            opacity: 0.5;
            animation: scan 3s linear infinite;
            z-index: 10;
            pointer-events: none;
        }
        
        @keyframes scan {
            0% { top: -10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }
        
        .rune-corner {
            position: absolute;
            font-size: 10px;
            color: rgba(0, 229, 255, 0.3);
            animation: pulse-rune 2s infinite alternate;
        }
        .rc-tl { top: 4px; left: 4px; }
        .rc-tr { top: 4px; right: 4px; }
        .rc-bl { bottom: 4px; left: 4px; }
        .rc-br { bottom: 4px; right: 4px; }
        
        @keyframes pulse-rune {
            0% { opacity: 0.2; text-shadow: 0 0 2px rgba(0, 229, 255, 0); }
            100% { opacity: 0.8; text-shadow: 0 0 5px rgba(0, 229, 255, 0.8); }
