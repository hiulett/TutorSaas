<style>
        body {
            background-color: #05070E;
            color: #e1e2ed;
        }
        
        .system-window {
            background-color: rgba(17, 19, 27, 0.94);
            border: 1px solid #00E5FF;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .system-window::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(0, 229, 255, 0.05) 0%, transparent 100%);
            pointer-events: none;
        }

        .system-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #00E5FF;
            color: #e1e2ed;
            font-family: 'JetBrains Mono', monospace;
            padding: 8px 0;
            width: 100%;
            outline: none;
            transition: box-shadow 0.3s ease;
        }

        .system-input:focus {
            box-shadow: 0 4px 10px -4px rgba(0, 229, 255, 0.5);
        }

        .system-button {
            border-radius: 4px;
            border: 1px solid #00E5FF;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .system-button:hover {
            background-color: #00E5FF;
            color: #000;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.8);
        }
        
        .system-cta {
             border-radius: 4px;
             border: 1px solid #9D4EDD;
             background-color: rgba(157, 78, 221, 0.2);
             color: #e6c3ff;
             transition: all 0.3s ease;
        }
        
        .system-cta:hover {
             background-color: #9D4EDD;
             color: #fff;
             box-shadow: 0 0 15px rgba(157, 78, 221, 0.8);
        }

        .holo-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(0, 229, 255, 0.5);
            animation: spin 10s linear infinite;
            pointer-events: none;
        }
        
        .holo-ring:nth-child(2) {
             animation: spin-reverse 15s linear infinite;
             border: 1px dashed rgba(0, 229, 255, 0.3);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        
        .runic-glyph {
             opacity: 0.1;
             animation: pulse 2s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 0.1; text-shadow: 0 0 0px #00E5FF; }
            100% { opacity: 0.3; text-shadow: 0 0 8px #00E5FF; }
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="min-h-screen flex flex-col font-body-md antialiased pt-16">
<!-- TopAppBar (Transactional - Nav hidden, but header present) -->

<div class="flex items-center gap-4 text-primary cursor-pointer active:scale-95 transition-transform">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</div>
<h1 class="font-display-title text-headline-md uppercase tracking-widest text-primary font-bold">SYSTEM STATUS: ONLINE</h1>
<div class="flex items-center gap-4 text-on-surface-variant">
<span class="material-symbols-outlined">settings</span>
</div>
</header>
<main class="flex-grow flex flex-col items-center px-margin-mobile py-8 w-full max-w-[600px] mx-auto">
<h2 class="font-headline-lg text-headline-lg text-primary mb-8 tracking-wider w-full text-center" style="text-shadow: 0 0 10px rgba(0,229,255,0.5);">HUNTER RECORD MODIFICATION</h2>
<!-- Avatar Section -->
<section class="system-window p-window-padding w-full rounded mb-gutter flex flex-col items-center justify-center relative">
<span class="material-symbols-outlined absolute top-2 left-2 text-primary runic-glyph">change_history</span>
<span class="material-symbols-outlined absolute top-2 right-2 text-primary runic-glyph">change_history</span>
<span class="material-symbols-outlined absolute bottom-2 left-2 text-primary runic-glyph">change_history</span>
<span class="material-symbols-outlined absolute bottom-2 right-2 text-primary runic-glyph">change_history</span>
<div class="relative w-32 h-32 mb-6 flex items-center justify-center">
<div class="holo-ring w-36 h-36"></div>
<div class="holo-ring w-40 h-40"></div>
<div class="w-28 h-28 rounded-full overflow-hidden border-2 border-primary z-10 bg-surface-container shadow-[0_0_15px_rgba(0,229,255,0.4)]">
<img class="w-full h-full object-cover grayscale opacity-80 mix-blend-screen" data-alt="A futuristic, cyberpunk-style portrait of a male hunter with glowing cyan eyes, wearing dark tactical gear with neon blue accents, set against a dark void background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAm9E76HYzuwPDas-1C-TiygybhpKid8c5ayUtOUc5byvNDewlDeOl6-fLcy9uO3mBsgVXwg_h1t9D6-QOIFjE1LPY4wk5OtqIkpeOLMd--Uu_Wt9gJgbebUnqW5b9BRUAG2Gx2A6Z22YXVIzUbFbZQPYJqCV5QqN18lt0Cuvm-oPRaTayf3iWAexT7nSJNtq3IKAOYyrpKrWe1ON1HLhIB2e8Cryjo0VK4hjAbC_G1IvKn57Kz0CXglkmBfnMwcRvB1C33y3XkeCZJ"/>
</div>
</div>
<button class="system-button px-6 py-2 font-label-caps text-label-caps text-primary uppercase tracking-widest flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">flip_camera_ios</span>
                CHANGE HOLOGRAM
            </button>
</section>
<!-- Form Fields Section -->
<section class="system-window p-window-padding w-full rounded flex flex-col gap-8 mb-8">
<div class="flex flex-col gap-2 relative">
<label class="font-label-caps text-label-caps text-primary/70 uppercase">Display Name</label>
<input class="system-input" type="text" value="Isaac Mendoza"/>
</div>
<div class="flex flex-col gap-2 relative">
<label class="font-label-caps text-label-caps text-primary/70 uppercase">Native Realm</label>
<input class="system-input" type="text" value="Spanish"/>
</div>
<div class="flex flex-col gap-2 relative">
<label class="font-label-caps text-label-caps text-primary/70 uppercase">Primary Combat Goal</label>
<input class="system-input" type="text" value="Career Expansion"/>
</div>
</section>
<!-- CTA Section -->
<button class="system-cta w-full py-4 font-headline-md text-headline-md uppercase tracking-wider font-bold shadow-[0_0_15px_rgba(157,78,221,0.4)] mt-auto mb-8 flex items-center justify-center gap-3">
<span class="material-symbols-outlined text-3xl">save</span>
            SAVE HUNTER DATA
        </button>
</main>
<script>
        // Simple ambient pulse for runic glyphs (CSS handles most, this just randomizes slightly)
        document.querySelectorAll('.runic-glyph').forEach(glyph => {
            glyph.style.animationDelay = `${Math.random() * 2}s`;
        });
    </script>
