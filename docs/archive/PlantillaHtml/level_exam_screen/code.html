<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Rank Evaluation Exam</title>
<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Config -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container": "#1d1f27",
                    "on-error-container": "#ffdad6",
                    "on-primary-container": "#00626e",
                    "tertiary-container": "#e6c3ff",
                    "surface-tint": "#00daf3",
                    "outline-variant": "#3b494c",
                    "on-secondary-fixed-variant": "#594400",
                    "on-primary-fixed-variant": "#004f58",
                    "surface-container-highest": "#32343d",
                    "on-primary": "#00363d",
                    "secondary-container": "#ffc703",
                    "inverse-surface": "#e1e2ed",
                    "primary-fixed-dim": "#00daf3",
                    "secondary-fixed-dim": "#f5bf00",
                    "surface-container-low": "#191b23",
                    "surface-bright": "#373942",
                    "on-background": "#e1e2ed",
                    "on-tertiary": "#4c007d",
                    "tertiary-fixed": "#f2daff",
                    "primary-container": "#00e5ff",
                    "on-surface-variant": "#bac9cc",
                    "on-primary-fixed": "#001f24",
                    "on-error": "#690005",
                    "outline": "#849396",
                    "background": "#11131b",
                    "tertiary-fixed-dim": "#e0b6ff",
                    "surface-variant": "#32343d",
                    "surface-container-high": "#272a32",
                    "tertiary": "#f8e7ff",
                    "inverse-on-surface": "#2e3039",
                    "error-container": "#93000a",
                    "on-tertiary-fixed-variant": "#6a0baa",
                    "on-secondary-container": "#6e5400",
                    "secondary-fixed": "#ffdf94",
                    "on-surface": "#e1e2ed",
                    "surface-dim": "#11131b",
                    "on-tertiary-container": "#7e2cbe",
                    "surface-container-lowest": "#0b0e16",
                    "secondary": "#ffe9b9",
                    "on-secondary": "#3e2e00",
                    "error": "#ffb4ab",
                    "primary": "#c3f5ff",
                    "surface": "#11131b",
                    "inverse-primary": "#006875",
                    "on-tertiary-fixed": "#2e004e",
                    "on-secondary-fixed": "#251a00",

            "borderRadius": {

                    "full": "0.75rem"
            },
            "spacing": {
                    "margin-desktop": "40px",
                    "gutter": "16px",
                    "window-padding": "24px",
                    "unit": "4px",
                    "margin-mobile": "20px"
            },
            "fontFamily": {
                    "headline-lg": ["Space Grotesk"],
                    "display-title": ["Space Grotesk"],
                    "body-lg": ["Inter"],
                    "stat-value": ["JetBrains Mono"],
                    "label-caps": ["JetBrains Mono"],
                    "headline-md": ["Space Grotesk"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "600"}],
                    "display-title": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "stat-value": ["20px", {"lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "label-caps": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}]
            }
          }
        }
      }
    </script>
<style>
        /* Scanline effect for authentic system window feel */
        .scanlines {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
        }
        
        /* Floating animation for the main window */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        /* Typewriter cursor blink */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .cursor-blink::after {
            content: '█';
            animation: blink 1s step-end infinite;
            color: #00e5ff;
            margin-left: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface h-screen w-full overflow-hidden flex flex-col relative select-none">
<!-- Void Background Elements -->
<div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_50%_0%,rgba(126,44,190,0.15),transparent_50%)]"></div>
<div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_50%_100%,rgba(0,229,255,0.05),transparent_50%)]"></div>
<div class="absolute inset-0 z-0 scanlines opacity-50"></div>
<!-- 
        NOTE: Standard Navigation Shells (TopAppBar / BottomNavBar) are suppressed here 
        because an Examination is a strict, linear/task-focused journey where the user 
        should not navigate away until complete or aborted.
    -->
<!-- Custom Exam Header Container -->
<header class="relative z-10 w-full px-margin-mobile pt-10 pb-4 flex flex-col gap-4 border-b border-surface-bright bg-surface/50 backdrop-blur-sm">
<!-- Top Status Row -->
<div class="flex justify-between items-center w-full">
<!-- Threat Indicator Badge -->
<div class="flex items-center gap-2 bg-error/10 px-3 py-1.5 rounded-full border border-error/30 shadow-[0_0_10px_rgba(255,180,171,0.2)]">
<span class="relative flex h-2.5 w-2.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-error opacity-75"></span>
<span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-error shadow-[0_0_5px_rgba(255,180,171,1)]"></span>
</span>
<span class="font-label-caps text-label-caps text-error tracking-widest uppercase">Active Threat</span>
</div>
<!-- Mana / Time Indicator -->
<div class="flex items-center gap-2 text-primary drop-shadow-[0_0_8px_rgba(0,229,255,0.6)]">
<span class="material-symbols-outlined text-[18px]">timer</span>
<span class="font-stat-value text-stat-value" id="exam-timer">04:59</span>
</div>
</div>
<!-- Exam Title -->
<div>
<h1 class="font-headline-md text-headline-md text-on-surface uppercase opacity-90">Rank Evaluation Exam:</h1>
<h2 class="font-headline-lg text-headline-lg text-primary-container tracking-tight drop-shadow-[0_0_5px_rgba(0,229,255,0.3)] uppercase mt-1">B1 Threshold</h2>
</div>
<!-- Minimal Progress Bar / Mana Line -->
<div class="w-full h-[2px] bg-surface-bright rounded-full overflow-hidden flex gap-[1px]">
<!-- Segmented look -->
<div class="h-full w-1/4 bg-primary-container shadow-[0_0_5px_rgba(0,229,255,0.8)]"></div>
<div class="h-full w-1/4 bg-primary-container shadow-[0_0_5px_rgba(0,229,255,0.8)]"></div>
<div class="h-full w-1/4 bg-primary-container shadow-[0_0_5px_rgba(0,229,255,0.8)]"></div>
<div class="h-full w-1/4 bg-transparent"></div>
</div>
</header>
<!-- Main Challenge Canvas -->
<main class="relative z-10 flex-1 w-full px-margin-mobile flex flex-col items-center justify-center -mt-10">
<div class="w-full max-w-[600px] flex flex-col gap-3 animate-float">
<!-- Mini Chips (Stats) -->
<div class="flex gap-3 px-2">
<div class="bg-surface-container-high border border-primary/40 rounded px-2.5 py-1.5 flex items-center gap-2 shadow-[0_0_8px_rgba(0,229,255,0.15)] backdrop-blur-md">
<span class="material-symbols-outlined text-[14px] text-primary">shield</span>
<span class="font-label-caps text-label-caps text-primary tracking-wider">Grammar Shield: 100%</span>
</div>
<div class="bg-surface-container-high border border-secondary-fixed-dim/40 rounded px-2.5 py-1.5 flex items-center gap-2 shadow-[0_0_8px_rgba(245,191,0,0.15)] backdrop-blur-md">
<span class="material-symbols-outlined text-[14px] text-secondary-fixed-dim">speed</span>
<span class="font-label-caps text-label-caps text-secondary-fixed-dim tracking-wider">WPM: 110</span>
</div>
</div>
<!-- The System Frame (Dark Glassmorphism with Purple Borders) -->
<div class="relative bg-surface/80 border border-on-tertiary-container p-window-padding shadow-[0_0_20px_rgba(126,44,190,0.3)] backdrop-blur-xl">
<!-- Arcane Corner Glyphs (Simulated with borders) -->
<div class="absolute top-0 left-0 w-3 h-3 border-t-[2px] border-l-[2px] border-tertiary-container -mt-[1px] -ml-[1px]"></div>
<div class="absolute top-0 right-0 w-3 h-3 border-t-[2px] border-r-[2px] border-tertiary-container -mt-[1px] -mr-[1px]"></div>
<div class="absolute bottom-0 left-0 w-3 h-3 border-b-[2px] border-l-[2px] border-tertiary-container -mb-[1px] -ml-[1px]"></div>
<div class="absolute bottom-0 right-0 w-3 h-3 border-b-[2px] border-r-[2px] border-tertiary-container -mb-[1px] -mr-[1px]"></div>
<!-- Evaluator Identity -->
<div class="font-label-caps text-label-caps text-on-tertiary-container mb-6 flex items-center gap-2 opacity-80 border-b border-on-tertiary-container/30 pb-2 inline-flex pr-6">
<span class="material-symbols-outlined text-[16px] animate-pulse">memory</span>
                    SYSTEM.EVALUATOR_AI
                </div>
<!-- AI Message Content -->
<p class="font-body-lg text-body-lg text-on-surface leading-relaxed cursor-blink" id="typewriter-text">
                    [SYSTEM TEST: A Dungeon Guardian asks for your business credentials. Respond verbally in English.]
                </p>
<!-- Decorative Mana Conduits -->
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1/2 h-[1px] bg-gradient-to-r from-transparent via-on-tertiary-container to-transparent opacity-50"></div>
</div>
</div>
</main>
<!-- Bottom Action Area: Mana Core Microphone -->
<div class="relative z-20 w-full pb-12 pt-8 flex justify-center bg-gradient-to-t from-background via-background/80 to-transparent">
<div class="relative flex items-center justify-center">
<!-- Pulsing Warning/Mana Rings -->
<div class="absolute w-24 h-24 rounded-full border-[1.5px] border-primary-container opacity-40 animate-[ping_2.5s_cubic-bezier(0,0,0.2,1)_infinite]"></div>
<div class="absolute w-32 h-32 rounded-full border border-primary opacity-20 animate-[ping_3.5s_cubic-bezier(0,0,0.2,1)_infinite_0.5s]"></div>
<!-- Core Interaction Button -->
<!-- Note: Contextual FAB applied here because the single intended action of this focused screen is to speak -->
<button class="relative z-10 w-20 h-20 bg-surface-container-high border-[2px] border-primary-container rounded-full flex items-center justify-center shadow-[0_0_25px_rgba(0,229,255,0.5)] active:scale-90 active:bg-primary-container transition-all duration-200 group">
<!-- Inner glow effect -->
<div class="absolute inset-2 rounded-full bg-primary-container/10 group-active:bg-transparent transition-colors"></div>
<span class="material-symbols-outlined text-[36px] text-primary-container group-active:text-background drop-shadow-[0_0_8px_rgba(0,229,255,0.8)] group-active:drop-shadow-none transition-colors" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                    mic
                </span>
</button>
<!-- Status Label -->
<div class="absolute -bottom-8 font-label-caps text-label-caps text-primary/70 tracking-widest whitespace-nowrap animate-pulse">
                HOLD TO CHANNEL
            </div>
</div>
</div>
<!-- Lightweight interaction script -->
<script>
        // Simple timer logic for the HUD
        let timeLeft = 299; // 4:59 in seconds
        const timerElement = document.getElementById('exam-timer');
        
        setInterval(() => {
            if (timeLeft <= 0) return;
            timeLeft--;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerElement.textContent = `0${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            
            // Pulse red when low on time
            if (timeLeft < 30) {
                timerElement.classList.add('text-error', 'drop-shadow-[0_0_8px_rgba(255,180,171,0.8)]');
                timerElement.classList.remove('text-primary', 'drop-shadow-[0_0_8px_rgba(0,229,255,0.6)]');
            }
        }, 1000);
    </script>
</body></html>
