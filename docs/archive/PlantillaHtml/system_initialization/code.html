<style>
        .mana-particle {
            position: absolute;
            background: #9D4EDD;
            border-radius: 50%;
            filter: blur(2px);
            animation: float-up infinite linear;
        }
        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.6; transform: translateY(50vh) scale(1); }
            100% { transform: translateY(-10vh) scale(0.5); opacity: 0; }
        }
        .rune-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            max-width: 600px;
            max-height: 600px;
            border: 1px dashed rgba(157, 78, 221, 0.2);
            border-radius: 50%;
            animation: rotate-slow 20s infinite linear;
            pointer-events: none;
        }
        .rune-circle::before {
            content: '';
            position: absolute;
            inset: 20px;
            border: 1px solid rgba(157, 78, 221, 0.1);
            border-radius: 50%;
            animation: rotate-slow-reverse 15s infinite linear;
        }
        @keyframes rotate-slow { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes rotate-slow-reverse { 100% { transform: rotate(-360deg); } }
        
        .glow-pulse { animation: pulse-border 2s infinite; }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 8px rgba(0, 229, 255, 0.3); }
            50% { box-shadow: 0 0 15px rgba(0, 229, 255, 0.6); }
            100% { box-shadow: 0 0 8px rgba(0, 229, 255, 0.3); }
        }
        .glitch-text { animation: glitch 4s infinite; }
        @keyframes glitch {
            0%, 95%, 100% { opacity: 1; transform: none; }
            96% { opacity: 0.8; transform: translate(1px, -1px); }
            97% { opacity: 0.9; transform: translate(-1px, 1px); }
            98% { opacity: 0.7; transform: translate(1px, 1px); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden relative font-body-md flex items-center justify-center">
<!-- Background Effects -->
<div class="absolute inset-0 bg-[#05070E] z-0"></div>
<div class="rune-circle z-0"></div>
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none" id="particles-container"></div>
<!-- Main Content -->
<main class="relative z-10 w-full max-w-[600px] px-margin-mobile md:px-0 flex flex-col items-center">
<!-- System Window -->
<div class="bg-surface/94 border border-primary-container glow-pulse rounded p-window-padding w-full relative overflow-hidden backdrop-blur-md">
<!-- Runic Glyphs (Corners) -->
<span class="material-symbols-outlined absolute top-2 left-2 text-primary-container/30 text-sm animate-pulse">crisis_alert</span>
<span class="material-symbols-outlined absolute top-2 right-2 text-primary-container/30 text-sm animate-pulse">magic_button</span>
<span class="material-symbols-outlined absolute bottom-2 left-2 text-primary-container/30 text-sm animate-pulse">join_inner</span>
<span class="material-symbols-outlined absolute bottom-2 right-2 text-primary-container/30 text-sm animate-pulse">radar</span>
<!-- System Message -->
<div class="text-center mb-8 glitch-text">
<h1 class="font-headline-md text-headline-md text-primary-container tracking-wider drop-shadow-[0_0_5px_rgba(0,229,255,0.5)]">
                    [SYSTEM MESSAGE: AWAKENING HUNTER CORE...]
                </h1>
</div>
<!-- Progress Bar Section -->
<div class="mb-6">
<div class="flex justify-between items-end mb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">SYNCHRONIZING CEFR SPELL LANGUAGE...</span>
<span class="font-stat-value text-stat-value text-tertiary-container drop-shadow-[0_0_8px_rgba(230,195,255,0.6)]">68%</span>
</div>
<div class="h-4 w-full bg-surface-container-highest border border-outline/30 flex gap-[1px] p-[1px]">
<!-- Segmented Bar implementation -->
<div class="h-full flex-1 bg-gradient-to-r from-primary-container to-[#9D4EDD] opacity-100"></div>
<div class="h-full flex-1 bg-gradient-to-r from-primary-container to-[#9D4EDD] opacity-100"></div>
<div class="h-full flex-1 bg-gradient-to-r from-primary-container to-[#9D4EDD] opacity-100"></div>
<div class="h-full flex-1 bg-gradient-to-r from-primary-container to-[#9D4EDD] opacity-100"></div>
<div class="h-full flex-1 bg-gradient-to-r from-primary-container to-[#9D4EDD] opacity-100"></div>
<div class="h-full flex-1 bg-gradient-to-r from-primary-container to-[#9D4EDD] opacity-100"></div>
<div class="h-full flex-1 bg-gradient-to-r from-primary-container to-[#9D4EDD] opacity-50"></div>
<div class="h-full flex-1 bg-transparent"></div>
<div class="h-full flex-1 bg-transparent"></div>
<div class="h-full flex-1 bg-transparent"></div>
</div>
</div>
<!-- Warning Text -->
<div class="text-center mt-8">
<p class="font-label-caps text-label-caps text-secondary-container animate-pulse flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[16px]">warning</span>
                    Warning: Unregistered Hunters will be designated Rank E
                </p>
</div>
<!-- Subtle background rune pattern inside window -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03] bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-tertiary-container via-surface to-background flex items-center justify-center">
<span class="material-symbols-outlined text-[120px]">rotate_90_degrees_cw</span>
</div>
</div>
</main>
<script>
        // Generate floating mana particles
        const container = document.getElementById('particles-container');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.classList.add('mana-particle');
            
            // Random properties
            const size = Math.random() * 4 + 1 + 'px';
            const left = Math.random() * 100 + 'vw';
            const duration = Math.random() * 5 + 3 + 's';
            const delay = Math.random() * 5 + 's';
            
            particle.style.width = size;
            particle.style.height = size;
            particle.style.left = left;
            particle.style.animationDuration = duration;
            particle.style.animationDelay = delay;
            
            container.appendChild(particle);
        }
    </script>
</body></html>
