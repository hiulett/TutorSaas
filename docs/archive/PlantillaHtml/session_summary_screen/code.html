<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quest Clear - Post-Battle Summary</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#1d1f27",
                        "on-error-container": "#ffdad6",
                        "on-primary-container": "#00626e",
                        "tertiary-container": "#e6c3ff",
                        "surface-tint": "#00daf3",
                        "outline-variant": "#3b494c",
                        "on-secondary-fixed-variant": "#594400",
                        "on-primary-fixed-variant": "#004f58",
                        "surface-container-highest": "#32343d",
                        "on-primary": "#00363d",
                        "secondary-container": "#ffc703",
                        "inverse-surface": "#e1e2ed",
                        "primary-fixed-dim": "#00daf3",
                        "secondary-fixed-dim": "#f5bf00",
                        "surface-container-low": "#191b23",
                        "surface-bright": "#373942",
                        "on-background": "#e1e2ed",
                        "on-tertiary": "#4c007d",
                        "tertiary-fixed": "#f2daff",
                        "primary-container": "#00e5ff",
                        "on-surface-variant": "#bac9cc",
                        "on-primary-fixed": "#001f24",
                        "on-error": "#690005",
                        "outline": "#849396",
                        "background": "#05070E",
                        "tertiary-fixed-dim": "#e0b6ff",
                        "surface-variant": "#32343d",
                        "surface-container-high": "#272a32",
                        "tertiary": "#f8e7ff",
                        "inverse-on-surface": "#2e3039",
                        "error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#6a0baa",
                        "on-secondary-container": "#6e5400",
                        "secondary-fixed": "#ffdf94",
                        "on-surface": "#e1e2ed",
                        "surface-dim": "#11131b",
                        "on-tertiary-container": "#7e2cbe",
                        "surface-container-lowest": "#0b0e16",
                        "secondary": "#ffe9b9",
                        "on-secondary": "#3e2e00",
                        "error": "#ffb4ab",
                        "primary": "#c3f5ff",
                        "surface": "#11131b",
                        "inverse-primary": "#006875",
                        "on-tertiary-fixed": "#2e004e",
                        "on-secondary-fixed": "#251a00",
                        "primary-fixed": "#9cf0ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-desktop": "40px",
                        "gutter": "16px",
                        "window-padding": "24px",
                        "unit": "4px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Space Grotesk"],
                        "display-title": ["Space Grotesk"],
                        "body-lg": ["Inter"],
                        "stat-value": ["JetBrains Mono"],
                        "label-caps": ["JetBrains Mono"],
                        "headline-md": ["Space Grotesk"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "display-title": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "stat-value": ["20px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "headline-md-mobile": ["20px", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #05070E;
            color: #e1e2ed;
        }
        
        .system-window {
            background-color: rgba(17, 19, 27, 0.94);
            border: 1px solid #00E5FF;
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .system-window::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('data:image/svg+xml;utf8,<svg width="20" height="20" xmlns="http://www.w3.org/2000/svg"><circle cx="2" cy="2" r="1" fill="%2300E5FF" opacity="0.1"/></svg>') repeat;
            pointer-events: none;
            z-index: 0;
        }

        .system-content {
            position: relative;
            z-index: 1;
        }

        .glow-text-gold {
            color: #FFC700;
            text-shadow: 0 0 10px rgba(255, 199, 0, 0.6);
        }

        .meter-ring {
            stroke: #00E5FF;
            filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.6));
            transition: stroke-dashoffset 1s ease-out;
        }
        
        .meter-bg {
            stroke: #191b23;
        }

        .system-button-primary {
            background: transparent;
            border: 1px solid #c3f5ff;
            color: #c3f5ff;
            transition: all 0.2s;
        }
        
        .system-button-primary:hover, .system-button-primary:active {
            background: #c3f5ff;
            color: #05070E;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
        }

        .system-button-secondary {
            background: rgba(25, 27, 35, 0.8);
            border: 1px solid #3b494c;
            color: #bac9cc;
            transition: all 0.2s;
        }

        .system-button-secondary:hover, .system-button-secondary:active {
            border-color: #00E5FF;
            color: #c3f5ff;
        }

        .vocab-chip {
            border: 1px solid #00E676;
            background: rgba(0, 230, 118, 0.1);
            box-shadow: 0 0 5px rgba(0, 230, 118, 0.2);
        }
        
        @keyframes pulse-rune {
            0% { opacity: 0.2; }
            50% { opacity: 0.6; }
            100% { opacity: 0.2; }
        }
        .rune {
            animation: pulse-rune 2s infinite;
            opacity: 0.2;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop overflow-x-hidden font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Container -->
<main class="w-full max-w-[600px] flex flex-col gap-6 relative z-10 pb-32">
<!-- Header -->
<header class="text-center w-full animate-[fadeInDown_0.5s_ease-out]">
<h1 class="font-headline-lg-mobile md:font-headline-lg glow-text-gold tracking-widest uppercase mb-2">
                [QUEST CLEAR: DUNGEON CONQUERED]
            </h1>
<p class="font-label-caps text-primary tracking-widest opacity-80">
                SYSTEM MESSAGE // REWARD PROTOCOL INITIATED
            </p>
</header>
<!-- Fluency Meter Section -->
<section class="flex flex-col items-center justify-center my-8 relative">
<!-- Background glow -->
<div class="absolute inset-0 bg-primary-container/10 blur-[50px] rounded-full w-64 h-64 mx-auto z-0"></div>
<div class="relative w-64 h-64 flex items-center justify-center z-10">
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 100 100">
<circle class="meter-bg" cx="50" cy="50" fill="none" r="45" stroke-width="2"></circle>
<!-- Dasharray calculation: 2 * pi * r = 2 * 3.14 * 45 = 282.6. For 88%, dashoffset = 282.6 * (1 - 0.88) = 33.9 -->
<circle class="meter-ring" cx="50" cy="50" fill="none" r="45" stroke-dasharray="282.6" stroke-dashoffset="33.9" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<div class="absolute flex flex-col items-center justify-center text-center">
<span class="font-label-caps text-on-surface-variant mb-1">FLUENCY SCORE</span>
<span class="font-display-title text-primary drop-shadow-[0_0_8px_rgba(0,229,255,0.8)]">88%</span>
</div>
<!-- Decorative Runes -->
<span class="material-symbols-outlined absolute top-2 left-1/2 -translate-x-1/2 text-primary rune text-[16px]">change_history</span>
<span class="material-symbols-outlined absolute bottom-2 left-1/2 -translate-x-1/2 text-primary rune text-[16px] rotate-180">change_history</span>
</div>
</section>
<!-- Stats Grid -->
<section class="grid grid-cols-1 md:grid-cols-3 gap-unit w-full animate-[fadeInUp_0.5s_ease-out_0.2s_both]">
<!-- Stat 1 -->
<div class="system-window rounded flex flex-col items-center justify-center p-gutter h-24">
<div class="system-content flex flex-col items-center w-full">
<span class="font-label-caps text-on-surface-variant mb-2">EXPERIENCE</span>
<span class="font-stat-value text-secondary-fixed-dim drop-shadow-[0_0_5px_rgba(245,191,0,0.5)]">+350 EXP</span>
</div>
</div>
<!-- Stat 2 -->
<div class="system-window rounded flex flex-col items-center justify-center p-gutter h-24">
<div class="system-content flex flex-col items-center w-full">
<span class="font-label-caps text-on-surface-variant mb-2">MASTERY</span>
<span class="font-stat-value text-primary">12 TERMS</span>
</div>
</div>
<!-- Stat 3 -->
<div class="system-window rounded flex flex-col items-center justify-center p-gutter h-24">
<div class="system-content flex flex-col items-center w-full">
<span class="font-label-caps text-on-surface-variant mb-2">OBJECTIVES</span>
<span class="font-stat-value text-primary">5/5 GOALS</span>
</div>
</div>
</section>
<!-- Vocabulary Chips -->
<section class="flex flex-col gap-unit mt-4 animate-[fadeInUp_0.5s_ease-out_0.4s_both]">
<h3 class="font-label-caps text-on-surface-variant mb-2 pl-2">NEW VOCABULARY ACQUIRED</h3>
<div class="flex flex-wrap gap-2">
<div class="vocab-chip rounded px-4 py-2 flex items-center gap-2">
<span class="font-stat-value text-[#00E676] text-sm">Resilience</span>
</div>
<div class="vocab-chip rounded px-4 py-2 flex items-center gap-2">
<span class="font-stat-value text-[#00E676] text-sm">Ephemeral</span>
</div>
<div class="vocab-chip rounded px-4 py-2 flex items-center gap-2">
<span class="font-stat-value text-[#00E676] text-sm">Paradigm</span>
</div>
<div class="vocab-chip rounded px-4 py-2 flex items-center gap-2">
<span class="font-stat-value text-[#00E676] text-sm">Juxtapose</span>
</div>
</div>
</section>
</main>
<!-- Bottom CTAs -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile md:p-margin-desktop bg-surface/80 backdrop-blur-md border-t border-primary/20 z-50 flex flex-col sm:flex-row gap-4 justify-center items-center">
<button class="w-full sm:w-auto system-button-secondary rounded h-14 px-8 font-label-caps tracking-widest flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">refresh</span>
            RETRY DUNGEON
        </button>
<button class="w-full sm:w-auto flex-1 system-window !border-[#e0b6ff] !shadow-[0_0_15px_rgba(224,182,255,0.4)] rounded h-14 px-8 font-label-caps tracking-widest flex items-center justify-center gap-2 text-[#e0b6ff] hover:bg-[#e0b6ff]/10 transition-colors">
            CONTINUE TO HEADQUARTERS
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
<!-- Background Atmospheric Elements -->
<div class="fixed inset-0 pointer-events-none z-[-1] opacity-30">
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary/20 rounded-full blur-[100px]"></div>
<div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-[#e0b6ff]/20 rounded-full blur-[80px]"></div>
</div>
<script>
        // Simple animation trigger for meter on load
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                const meter = document.querySelector('.meter-ring');
                if(meter) {
                    // Force a reflow
                    void meter.offsetWidth;
                    // Reset to animated state (handled by CSS transition initially, but good for reactiveness)
                }
            }, 100);
        });
    </script>
</body></html>
