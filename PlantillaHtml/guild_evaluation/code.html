<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>Guild Evaluation System</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@600;700&amp;family=Inter:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .system-glow { box-shadow: 0 0 8px rgba(0, 229, 255, 0.3); }
        .system-glow-strong { box-shadow: 0 0 15px rgba(0, 229, 255, 0.5); }
        .system-text-glow { text-shadow: 0 0 8px rgba(0, 229, 255, 0.5); }
        .runic-pattern {
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 229, 255, 0.05) 0%, transparent 50%),
                              linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            background-size: 100% 100%;
        }
        .skill-slot:hover {
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.4), inset 0 0 15px rgba(0, 229, 255, 0.1);
        }
        .rune-corner {
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: #ffc703;
            opacity: 0.8;
            animation: pulse-rune 2s infinite alternate;
        }
        .rune-tl { top: -2px; left: -2px; border-top: 2px solid; border-left: 2px solid; }
        .rune-tr { top: -2px; right: -2px; border-top: 2px solid; border-right: 2px solid; }
        .rune-bl { bottom: -2px; left: -2px; border-bottom: 2px solid; border-left: 2px solid; }
        .rune-br { bottom: -2px; right: -2px; border-bottom: 2px solid; border-right: 2px solid; }
        
        @keyframes pulse-rune {
            0% { opacity: 0.4; box-shadow: 0 0 0px #ffc703; }
            100% { opacity: 0.9; box-shadow: 0 0 5px #ffc703; }
        }
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#05070E] text-on-surface min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop overflow-x-hidden relative">
<!-- Atmospheric Background -->
<div class="fixed inset-0 pointer-events-none z-[-1]" style="background: radial-gradient(circle at top, rgba(0,229,255,0.05) 0%, transparent 60%);"></div>
<div class="fixed inset-0 pointer-events-none z-[-1] opacity-20" style="background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,229,255,0.1) 2px, rgba(0,229,255,0.1) 4px); animation: scanline 10s linear infinite;"></div>
<!-- Main System Window -->
<main class="w-full max-w-[600px] relative mt-10 md:mt-16">
<!-- Header / Quest Info -->
<header class="flex justify-between items-center mb-6">
<h1 class="font-headline-md text-headline-md text-primary system-text-glow tracking-widest uppercase">EVALUATION QUEST: STEP 02/05</h1>
<div class="flex items-center gap-2 bg-secondary-container/10 border border-secondary-container px-3 py-1 rounded-DEFAULT">
<span class="material-symbols-outlined text-secondary-container text-[18px]">hourglass_empty</span>
<span class="font-stat-value text-stat-value text-secondary-container">04:59</span>
</div>
</header>
<!-- System Prompt Area -->
<div class="relative bg-surface/94 border border-primary-container system-glow p-window-padding rounded-DEFAULT mb-6 runic-pattern">
<!-- Runic Brackets -->
<div class="rune-corner rune-tl"></div>
<div class="rune-corner rune-tr"></div>
<div class="rune-corner rune-bl"></div>
<div class="rune-corner rune-br"></div>
<p class="font-label-caps text-label-caps text-primary mb-2 opacity-80">&gt; SYSTEM INQUIRY</p>
<p class="font-body-lg text-body-lg text-on-surface">
<span class="text-error font-bold">[SYSTEM NOTICE]</span> Cadet, state your primary English combat specialty. Choose wisely, this determines your starting rank.
            </p>
</div>
<!-- Skill Slots Selection -->
<div class="flex flex-col gap-unit mb-8">
<!-- Option 1 -->
<label class="skill-slot group relative cursor-pointer block border border-outline-variant bg-surface-container-high/80 rounded-DEFAULT p-4 transition-all duration-300 has-[:checked]:border-primary-container has-[:checked]:bg-primary-container/10 has-[:checked]:system-glow">
<input checked="" class="sr-only" name="combat_specialty" type="radio"/>
<div class="flex justify-between items-center">
<div>
<h3 class="font-headline-md text-[18px] text-on-surface group-hover:text-primary transition-colors">Daily Conversation</h3>
<p class="font-body-md text-[14px] text-on-surface-variant mt-1">Focus on essential communicative strikes.</p>
</div>
<div class="text-right">
<span class="block font-stat-value text-stat-value text-outline group-has-[:checked]:text-primary group-has-[:checked]:system-text-glow">Rank E-D</span>
<span class="block font-label-caps text-label-caps text-outline-variant mt-1">A1-B1</span>
</div>
</div>
<div class="absolute inset-y-0 left-0 w-1 bg-primary-container scale-y-0 group-has-[:checked]:scale-y-100 transition-transform origin-center"></div>
</label>
<!-- Option 2 -->
<label class="skill-slot group relative cursor-pointer block border border-outline-variant bg-surface-container-high/80 rounded-DEFAULT p-4 transition-all duration-300 has-[:checked]:border-primary-container has-[:checked]:bg-primary-container/10 has-[:checked]:system-glow">
<input class="sr-only" name="combat_specialty" type="radio"/>
<div class="flex justify-between items-center">
<div>
<h3 class="font-headline-md text-[18px] text-on-surface group-hover:text-primary transition-colors">Business &amp; Guild Negotiations</h3>
<p class="font-body-md text-[14px] text-on-surface-variant mt-1">Advanced tactical terminology for high-stakes pacts.</p>
</div>
<div class="text-right">
<span class="block font-stat-value text-stat-value text-outline group-has-[:checked]:text-primary group-has-[:checked]:system-text-glow">Rank C-A</span>
<span class="block font-label-caps text-label-caps text-outline-variant mt-1">B2-C1</span>
</div>
</div>
<div class="absolute inset-y-0 left-0 w-1 bg-primary-container scale-y-0 group-has-[:checked]:scale-y-100 transition-transform origin-center"></div>
</label>
<!-- Option 3 -->
<label class="skill-slot group relative cursor-pointer block border border-outline-variant bg-surface-container-high/80 rounded-DEFAULT p-4 transition-all duration-300 has-[:checked]:border-primary-container has-[:checked]:bg-primary-container/10 has-[:checked]:system-glow">
<input class="sr-only" name="combat_specialty" type="radio"/>
<div class="flex justify-between items-center">
<div>
<h3 class="font-headline-md text-[18px] text-on-surface group-hover:text-primary transition-colors">Rapid Speech Combos</h3>
<p class="font-body-md text-[14px] text-on-surface-variant mt-1">Fluidity and speed training for overwhelming opponents.</p>
</div>
<div class="text-right">
<span class="block font-stat-value text-stat-value text-outline group-has-[:checked]:text-primary group-has-[:checked]:system-text-glow">Rank B-S</span>
<span class="block font-label-caps text-label-caps text-outline-variant mt-1">C1-C2</span>
</div>
</div>
<div class="absolute inset-y-0 left-0 w-1 bg-primary-container scale-y-0 group-has-[:checked]:scale-y-100 transition-transform origin-center"></div>
</label>
<!-- Option 4 -->
<label class="skill-slot group relative cursor-pointer block border border-outline-variant bg-surface-container-high/80 rounded-DEFAULT p-4 transition-all duration-300 has-[:checked]:border-primary-container has-[:checked]:bg-primary-container/10 has-[:checked]:system-glow">
<input class="sr-only" name="combat_specialty" type="radio"/>
<div class="flex justify-between items-center">
<div>
<h3 class="font-headline-md text-[18px] text-on-surface group-hover:text-primary transition-colors">Grammar Shield Mastery</h3>
<p class="font-body-md text-[14px] text-on-surface-variant mt-1">Flawless structural defense against logical fallacies.</p>
</div>
<div class="text-right">
<span class="block font-stat-value text-stat-value text-outline group-has-[:checked]:text-primary group-has-[:checked]:system-text-glow">Rank A-S</span>
<span class="block font-label-caps text-label-caps text-outline-variant mt-1">C2+</span>
</div>
</div>
<div class="absolute inset-y-0 left-0 w-1 bg-primary-container scale-y-0 group-has-[:checked]:scale-y-100 transition-transform origin-center"></div>
</label>
</div>
<!-- Action Button -->
<button class="w-full bg-[#9D4EDD] hover:bg-[#8A2BE2] text-white font-headline-md text-[20px] py-4 rounded-DEFAULT transition-all duration-300 shadow-[0_0_15px_rgba(157,78,221,0.4)] hover:shadow-[0_0_25px_rgba(157,78,221,0.8)] border border-[#C77DFF] active:scale-[0.98]">
            ACCEPT SYSTEM EVALUATION
        </button>
</main>
</body></html>
